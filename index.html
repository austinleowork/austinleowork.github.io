<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>@austinle0</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="austinle0">
<meta property="og:title" content="@austinle0">
<meta property="og:description" content="austinle0">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23e8ecf2'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;width:100%;overflow:hidden;background:#000;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}

  /* ---- signature ---- */
  .sig{
    position:absolute;left:0;right:0;bottom:max(28px, env(safe-area-inset-bottom));
    text-align:center;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.34em;text-transform:lowercase;
    color:rgba(255,255,255,.30);
    user-select:none;pointer-events:none;
    opacity:0;animation:rise 1.6s cubic-bezier(.16,1,.3,1) 1.1s forwards;
    text-indent:.34em;
    z-index:3;
  }

  /* ---- corner marks ---- */
  .mark{
    position:absolute;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(255,255,255,.16);
    user-select:none;pointer-events:none;
    opacity:0;animation:rise 1.6s cubic-bezier(.16,1,.3,1) 1.35s forwards;
    z-index:3;
  }
  .mark.tl{top:26px;left:28px}
  .mark.tr{top:26px;right:28px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- cursor ---- */
  .ring{
    position:fixed;top:0;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;
    border:1px solid rgba(255,255,255,.34);border-radius:50%;
    pointer-events:none;z-index:5;opacity:0;
    transition:opacity .4s ease, width .25s cubic-bezier(.16,1,.3,1), height .25s cubic-bezier(.16,1,.3,1), margin .25s cubic-bezier(.16,1,.3,1), border-color .25s ease;
    mix-blend-mode:difference;
  }
  .ring.on{opacity:1}
  .ring.down{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-color:rgba(255,255,255,.8)}
  html.fine, html.fine body{cursor:none}
  html.coarse .ring{display:none}

  /* ---- hint ---- */
  .hint{
    position:absolute;left:0;right:0;bottom:max(58px, calc(env(safe-area-inset-bottom) + 30px));
    text-align:center;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(255,255,255,.13);
    user-select:none;pointer-events:none;z-index:3;
    opacity:0;animation:rise 1.6s cubic-bezier(.16,1,.3,1) 1.9s forwards;
    transition:opacity .7s ease;
    text-indent:.3em;
  }
  .hint.gone{opacity:0 !important}

  /* ---- no-webgl fallback ---- */
  .fallback{
    position:absolute;inset:0;display:none;place-items:center;
    background:
      radial-gradient(38% 38% at 44% 36%, #ffffff 0%, #cdd4de 22%, #5b626d 46%, #14171c 72%, #05070a 100%),
      #000;
    z-index:1;
  }
  html.nogl .fallback{display:grid}
  html.nogl canvas{display:none}
  .fallback i{
    display:block;width:min(46vmin,320px);aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(46% 40% at 36% 28%, #fff 0%, rgba(255,255,255,.85) 12%, transparent 46%),
      radial-gradient(70% 60% at 70% 78%, rgba(150,170,200,.55) 0%, transparent 60%),
      linear-gradient(160deg,#e9edf3 0%,#8f97a4 34%,#2a2f38 62%,#c9d1dc 82%,#3a404a 100%);
    filter:blur(.3px);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="fallback"><i></i></div>

<div class="mark tl">liquid / 01</div>
<div class="mark tr">mmxxvi</div>
<div class="hint" id="hint">move it</div>
<div class="sig">@austinle0</div>
<div class="ring" id="ring"></div>

<script>
(function () {
  "use strict";

  var html = document.documentElement;
  var fine = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  html.classList.add(fine ? "fine" : "coarse");

  var canvas = document.getElementById("c");
  var gl = canvas.getContext("webgl", {
    alpha: false, antialias: false, depth: false, stencil: false,
    powerPreference: "high-performance", preserveDrawingBuffer: false
  }) || canvas.getContext("experimental-webgl");

  if (!gl) { html.classList.add("nogl"); return; }

  /* ------------------------------------------------------------------ */
  /*  shaders                                                            */
  /* ------------------------------------------------------------------ */

  var VERT = [
    "attribute vec2 p;",
    "void main(){ gl_Position = vec4(p,0.0,1.0); }"
  ].join("\n");

  var NB = 10; // 1 core + 5 orbiters + 1 cursor + 3 droplets

  var FRAG = [
    /* older mobile GPUs don't guarantee highp in fragment shaders */
    "#ifdef GL_FRAGMENT_PRECISION_HIGH",
    "precision highp float;",
    "#else",
    "precision mediump float;",
    "#endif",
    "uniform vec2  u_res;",
    "uniform float u_time;",
    "uniform vec4  u_balls[" + NB + "];",
    "uniform float u_shock;",
    "uniform float u_intro;",
    "uniform float u_grain;",

    /* --- smooth minimum (the thing that makes it read as liquid) --- */
    "float smin(float a, float b, float k){",
    "  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);",
    "  return mix(b, a, h) - k*h*(1.0-h);",
    "}",

    /* --- signed distance field --- */
    "float map(vec3 p){",
    "  float d = 1.0e5;",
    "  for(int i=0;i<" + NB + ";i++){",
    "    vec4 b = u_balls[i];",
    "    d = smin(d, length(p - b.xyz) - b.w, 0.52);",
    "  }",
    "  d += 0.035 * u_shock * sin(11.0*length(p) - u_time*9.0);",
    "  return d;",
    "}",

    "vec3 nrm(vec3 p){",
    "  vec2 e = vec2(1.0,-1.0)*0.0016;",
    "  return normalize( e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx)",
    "                  + e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx) );",
    "}",

    /* --- procedural studio: horizon softbox + 3 vertical strips + key --- */
    "vec3 env(vec3 r){",
    "  float y = r.y;",
    "  vec3 c = mix(vec3(0.012,0.014,0.022), vec3(0.40,0.435,0.505), smoothstep(-0.45,0.95,y));",
    "  c = mix(vec3(0.006,0.006,0.010), c, smoothstep(-0.95,-0.02,y));",
    "  c += vec3(0.30,0.33,0.40) * pow(max(y,0.0), 2.2) * 0.85;",
    /* NB: smoothstep with edge0 > edge1 is undefined in GLSL -- invert instead */
    "  float band = 1.0 - smoothstep(0.0,0.26,abs(y-0.055));",
    "  c += vec3(0.80,0.86,1.00) * band * 0.60;",
    "  float a = atan(r.z, r.x);",
    "  float strips = smoothstep(0.52,0.96,sin(a*3.0+0.55)) * smoothstep(-0.62,0.35,y);",
    "  c += vec3(1.0,0.99,0.97) * strips * 1.35;",
    "  float key = pow(max(dot(r, normalize(vec3(0.46,0.72,0.40))),0.0), 150.0);",
    "  c += vec3(1.0,0.975,0.93) * key * 7.0;",
    "  float fill = pow(max(dot(r, normalize(vec3(-0.70,0.18,-0.62))),0.0), 22.0);",
    "  c += vec3(0.40,0.52,0.85) * fill * 0.80;",
    "  float low = pow(max(dot(r, normalize(vec3(0.10,-0.90,0.35))),0.0), 9.0);",
    "  c += vec3(0.22,0.235,0.28) * low * 0.45;",
    "  return c;",
    "}",

    /* --- filmic --- */
    "vec3 aces(vec3 x){",
    "  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);",
    "}",

    "float hash(vec2 v){ return fract(sin(dot(v, vec2(12.9898,78.233))) * 43758.5453); }",

    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy*2.0 - u_res) / u_res.y;",
    "  vec3 ro = vec3(0.0,0.0,4.0);",
    "  vec3 rd = normalize(vec3(uv, -2.0));",

    "  float t = 0.0; float hit = 0.0; float glow = 0.0;",
    "  for(int i=0;i<86;i++){",
    "    vec3 p = ro + rd*t;",
    "    float d = map(p);",
    "    glow += exp(-7.0*max(d,0.0)) * 0.016;",
    "    if(d < 0.0016){ hit = 1.0; break; }",
    "    t += d*0.86;",
    "    if(t > 9.0) break;",
    "  }",
    "  glow = clamp(glow, 0.0, 1.0);",

    /* background: near-black with a breath of light behind the shape */
    "  vec3 col = vec3(0.0035,0.0042,0.0060) * (1.0 - 0.55*length(uv)*0.5);",
    "  col += vec3(0.26,0.33,0.52) * pow(glow, 1.6) * 0.30;",

    "  if(hit > 0.5){",
    "    vec3 p = ro + rd*t;",
    "    vec3 n = nrm(p);",
    "    vec3 r = reflect(rd, n);",
    /* chromatic split on the reflection = expensive-looking chrome */
    "    vec3 rr = reflect(rd, normalize(n + vec3( 0.0035, 0.0,-0.0035)));",
    "    vec3 rb = reflect(rd, normalize(n + vec3(-0.0035, 0.0, 0.0035)));",
    "    vec3 e = vec3(env(rr).r, env(r).g, env(rb).b);",
    /* a whisper of micro-roughness so it isn't a perfect mirror */
    "    e = mix(e, env(n)*0.55, 0.10);",
    "    vec3 F0 = vec3(0.955,0.965,0.985);",
    "    float fr = pow(1.0 - max(dot(n,-rd),0.0), 5.0);",
    "    vec3 F = F0 + (1.0-F0)*fr;",
    "    col = e * F;",
    /* grazing-angle lift along the silhouette */
    "    col += vec3(0.55,0.62,0.80) * pow(fr, 1.8) * 0.16;",
    "  }",

    "  col *= u_intro;",
    "  col = aces(col * 1.06);",
    "  col = pow(col, vec3(1.0/2.2));",
    /* vignette */
    "  col *= 1.0 - 0.30*pow(length(uv*vec2(0.62,0.80)), 2.3);",
    /* dither — kills the banding that makes these look cheap */
    "  float g = hash(gl_FragCoord.xy + u_grain);",
    "  col += (g - 0.5) * 0.0075;",
    "  gl_FragColor = vec4(max(col, 0.0), 1.0);",
    "}"
  ].join("\n");

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { html.classList.add("nogl"); return; }

  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { html.classList.add("nogl"); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var U = {
    res:   gl.getUniformLocation(prog, "u_res"),
    time:  gl.getUniformLocation(prog, "u_time"),
    balls: gl.getUniformLocation(prog, "u_balls"),
    shock: gl.getUniformLocation(prog, "u_shock"),
    intro: gl.getUniformLocation(prog, "u_intro"),
    grain: gl.getUniformLocation(prog, "u_grain")
  };

  /* ------------------------------------------------------------------ */
  /*  sizing                                                             */
  /* ------------------------------------------------------------------ */

  var W = 0, H = 0, scale = 1;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, fine ? 1.75 : 1.5);
    var w = window.innerWidth, h = window.innerHeight;
    // keep the pixel budget sane on huge displays / small phones alike
    var budget = 2100000;
    scale = Math.min(1, Math.sqrt(budget / (w * dpr * h * dpr)));
    W = Math.max(1, Math.round(w * dpr * scale));
    H = Math.max(1, Math.round(h * dpr * scale));
    canvas.width = W; canvas.height = H;
    gl.viewport(0, 0, W, H);
  }
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 250); });

  /* ------------------------------------------------------------------ */
  /*  pointer                                                            */
  /* ------------------------------------------------------------------ */

  var ring = document.getElementById("ring");
  var hint = document.getElementById("hint");
  var hintGone = false;

  var ptr = { x: 0, y: 0, has: false };   // world-space target

  function setPointer(cx, cy) {
    var w = window.innerWidth, h = window.innerHeight;
    var ux = (cx * 2 - w) / h;
    var uy = -(cy * 2 - h) / h;
    ptr.x = ux * 2.0;
    ptr.y = uy * 2.0;
    ptr.has = true;
    if (!hintGone) { hintGone = true; hint.classList.add("gone"); }
  }

  window.addEventListener("mousemove", function (e) {
    setPointer(e.clientX, e.clientY);
    ring.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
    ring.classList.add("on");
  }, { passive: true });

  window.addEventListener("mouseleave", function () {
    ptr.has = false; ring.classList.remove("on");
  });

  window.addEventListener("mousedown", function () { ring.classList.add("down"); shock = 1.0; });
  window.addEventListener("mouseup",   function () { ring.classList.remove("down"); });

  window.addEventListener("touchstart", function (e) {
    if (e.touches[0]) { setPointer(e.touches[0].clientX, e.touches[0].clientY); shock = 1.0; }
  }, { passive: true });

  window.addEventListener("touchmove", function (e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener("touchend", function () { ptr.has = false; }, { passive: true });

  /* device tilt drives it on phones so it isn't dead without a finger */
  var tilt = { x: 0, y: 0 };
  window.addEventListener("deviceorientation", function (e) {
    if (e.gamma == null || e.beta == null) return;
    tilt.x = Math.max(-1, Math.min(1, e.gamma / 32)) * 1.15;
    tilt.y = Math.max(-1, Math.min(1, (e.beta - 45) / 32)) * -1.15;
  }, true);

  /* ------------------------------------------------------------------ */
  /*  simulation                                                         */
  /* ------------------------------------------------------------------ */

  var data = new Float32Array(NB * 4);

  var CORE_R = 0.78;

  var orbits = [];
  for (var i = 0; i < 5; i++) {
    orbits.push({
      a:  Math.random() * Math.PI * 2,
      sp: 0.10 + Math.random() * 0.16,
      rad:0.52 + Math.random() * 0.30,
      sz: 0.26 + Math.random() * 0.15,
      ph: Math.random() * Math.PI * 2,
      tl: 0.35 + Math.random() * 0.55
    });
  }

  var cur = { x: 0, y: 0, z: 0.45, vx: 0, vy: 0, r: 0 };

  var drops = [];
  for (var j = 0; j < 3; j++) drops.push({ x:0, y:0, z:0, vx:0, vy:0, life:0 });
  var dropCooldown = 0;

  var shock = 0;
  var intro = 0;
  var time  = 0;
  var last  = performance.now();
  var running = true;

  document.addEventListener("visibilitychange", function () {
    running = !document.hidden;
    if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });

  function frame(now) {
    if (!running) return;

    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;
    var k = dt * 60; // frame-rate independent easing factor

    intro += (1 - intro) * (1 - Math.pow(0.955, k));
    shock *= Math.pow(0.90, k);

    /* --- target: pointer, tilt, or a slow idle wander --- */
    var tx, ty;
    if (ptr.has) {
      tx = ptr.x; ty = ptr.y;
    } else if (tilt.x || tilt.y) {
      tx = tilt.x; ty = tilt.y;
    } else {
      tx = Math.cos(time * 0.31) * 1.05 + Math.cos(time * 0.13) * 0.35;
      ty = Math.sin(time * 0.24) * 0.85 + Math.sin(time * 0.17) * 0.30;
    }

    /* --- cursor blob: springy, with real velocity --- */
    var px = cur.x, py = cur.y;
    cur.x += (tx - cur.x) * (1 - Math.pow(0.86, k));
    cur.y += (ty - cur.y) * (1 - Math.pow(0.86, k));
    var mvx = (cur.x - px) / Math.max(dt, 0.0001);
    var mvy = (cur.y - py) / Math.max(dt, 0.0001);
    var speed = Math.sqrt(mvx * mvx + mvy * mvy);

    /* it swells when it's near the core, thins out when it's stretched far */
    var dist = Math.sqrt(cur.x * cur.x + cur.y * cur.y);
    var want = 0.40 - Math.min(dist, 2.4) * 0.075;
    cur.r += (want - cur.r) * (1 - Math.pow(0.88, k));
    cur.z = 0.42 + Math.sin(time * 0.7) * 0.10;

    /* --- droplets tear off when you whip the cursor --- */
    dropCooldown -= dt;
    if (speed > 5.2 && dropCooldown <= 0) {
      for (var d = 0; d < drops.length; d++) {
        if (drops[d].life <= 0) {
          drops[d].x = cur.x; drops[d].y = cur.y; drops[d].z = cur.z;
          drops[d].vx = mvx * 0.16 + (Math.random() - 0.5) * 0.5;
          drops[d].vy = mvy * 0.16 + (Math.random() - 0.5) * 0.5;
          drops[d].life = 1.0;
          dropCooldown = 0.34;
          break;
        }
      }
    }

    for (var q = 0; q < drops.length; q++) {
      var dp = drops[q];
      if (dp.life <= 0) continue;
      dp.life -= dt * 0.62;
      // pulled home
      dp.vx += (-dp.x) * 5.0 * dt;
      dp.vy += (-dp.y) * 5.0 * dt;
      dp.vx *= Math.pow(0.965, k);
      dp.vy *= Math.pow(0.965, k);
      dp.x += dp.vx * dt * 3.4;
      dp.y += dp.vy * dt * 3.4;
      dp.z *= Math.pow(0.99, k);
      if (dp.life <= 0) { dp.life = 0; dp.x = 0; dp.y = 0; dp.z = 0; dp.vx = 0; dp.vy = 0; }
    }

    /* --- pack the uniform array --- */
    var n = 0;
    function put(x, y, z, r) {
      data[n++] = x; data[n++] = y; data[n++] = z; data[n++] = r * intro;
    }

    // core — breathing, drifting, squashed slightly toward the cursor
    var breathe = 1.0 + Math.sin(time * 0.62) * 0.035 + Math.sin(time * 1.31) * 0.018;
    put(
      Math.sin(time * 0.23) * 0.055 + cur.x * 0.055,
      Math.cos(time * 0.19) * 0.045 + cur.y * 0.055,
      0.0,
      CORE_R * breathe + shock * 0.05
    );

    // orbiters
    for (var o = 0; o < orbits.length; o++) {
      var ob = orbits[o];
      ob.a += ob.sp * dt;
      var rr = ob.rad * (1.0 + Math.sin(time * 0.5 + ob.ph) * 0.16);
      var ox = Math.cos(ob.a) * rr;
      var oy = Math.sin(ob.a * 1.13 + ob.ph) * rr * 0.82;
      var oz = Math.sin(ob.a * 0.77 + ob.ph) * rr * 0.72;
      // they lean toward wherever you are
      ox += cur.x * ob.tl * 0.30;
      oy += cur.y * ob.tl * 0.30;
      put(ox, oy, oz, ob.sz * (1.0 + Math.sin(time * 0.9 + ob.ph) * 0.14));
    }

    // cursor blob
    put(cur.x, cur.y, cur.z, Math.max(cur.r, 0.10));

    // droplets
    for (var z2 = 0; z2 < drops.length; z2++) {
      var e2 = drops[z2];
      var er = e2.life > 0
        ? 0.30 * Math.sin(Math.min(e2.life, 1.0) * Math.PI) + 0.08
        : 0.09;
      put(e2.x, e2.y, e2.z, er);
    }

    /* --- draw --- */
    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.time, time);
    gl.uniform1f(U.shock, shock);
    gl.uniform1f(U.intro, intro);
    gl.uniform1f(U.grain, Math.random() * 1000.0);
    gl.uniform4fv(U.balls, data);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
